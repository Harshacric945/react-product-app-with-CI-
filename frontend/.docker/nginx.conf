worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name _;  # Accept all host headers (good for K8s Ingress/ALB)

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        # Optional: cache control headers for env.js or index.html
        location /env.js {
            add_header Cache-Control "no-store";
        }
    }
}
